name: Build ReelGauge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ReelGauge.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelGauge-APK
          path: dist/ReelGauge.apk

      - name: Publish one-click Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ReelGauge Latest APK
          body: Automated APK build from the latest commit. Click `ReelGauge.apk` below to download and install on Android.
          files: dist/ReelGauge.apk
